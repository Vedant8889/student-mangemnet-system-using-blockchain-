<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Student Record</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .form-container {
            background-color: #1a1a1a;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 500px;
            animation: fadeIn 1s ease-in-out;
        }

        h2 {
            font-weight: 600;
            margin-bottom: 30px;
            color: #ffffff;
        }

        .form-group label {
            font-weight: 500;
            color: #ccc;
        }

        .form-control {
            background-color: #2c2c2c;
            color: #fff;
            border: 1px solid #444;
        }

        .form-control::placeholder {
            color: #aaa;
        }

        .btn-submit {
            background: linear-gradient(to right, #007bff, #00c6ff);
            color: white;
            border: none;
            transition: background 0.3s ease;
        }

        .btn-submit:hover {
            background: linear-gradient(to right, #0056b3, #0099cc);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-link {
            margin-top: 20px;
            text-align: center;
        }

        .back-link a {
            text-decoration: none;
            color: #00c6ff;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2 class="text-center">🧾 Add Student Record</h2>
    <form method="post" action="/add">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" class="form-control" id="name" name="name" placeholder="Enter student's name" required>
        </div>
        <div class="form-group">
            <label for="roll">Roll Number</label>
            <input type="text" class="form-control" id="roll" name="roll" placeholder="Roll No (e.g. 1023)" required>
        </div>
        <div class="form-group">
            <label for="course">Course Name</label>
            <input type="text" class="form-control" id="course" name="course" placeholder="e.g. B.Tech CSE" required>
        </div>
        <div class="form-group">
            <label for="marks">Marks</label>
            <input type="number" class="form-control" id="marks" name="marks" placeholder="Out of 100" required min="0" max="100">
        </div>
        <button type="submit" class="btn btn-submit btn-block">Add to Blockchain</button>
    </form>

    <div class="back-link">
        <a href="/">← Back to Home</a>
    </div>
</div>

</body>
</html>
